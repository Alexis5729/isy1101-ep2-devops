name: Docker Build and Push

on:
  push:
    branches:
      - deploy

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # FRONTEND
      - name: Build frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend-despacho:latest ./front_despacho

      - name: Push frontend
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend-despacho:latest

      # BACKEND DESPACHO
      - name: Build backend despacho
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/backend-despacho:latest ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO

      - name: Push backend despacho
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/backend-despacho:latest

      # BACKEND VENTAS
      - name: Build backend ventas
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/backend-ventas:latest ./back-Ventas_SpringBoot/Springboot-API-REST

      - name: Push backend ventas
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/backend-ventas:latest